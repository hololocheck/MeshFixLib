<!-- Web Worker コード -->
<script id="workerCode" type="text/worker">
// ===== WASM モジュール =====
var wasmModule = null;
var wasmReady = false;

// ===== ユーティリティ =====
function vKey(v, precision) {
  if (precision === undefined) precision = 6;
  return v[0].toFixed(precision) + '_' + v[1].toFixed(precision) + '_' + v[2].toFixed(precision);
}

function windingKey(a, b, c) {
  if (a <= b && a <= c) return a + ',' + b + ',' + c;
  if (b <= a && b <= c) return b + ',' + c + ',' + a;
  return c + ',' + a + ',' + b;
}

function unorderedKey(a, b, c) {
  var x = a, y = b, z = c;
  if (x > y) { var t = x; x = y; y = t; }
  if (y > z) { var t = y; y = z; z = t; }
  if (x > y) { var t = x; x = y; y = t; }
  return x + ',' + y + ',' + z;
}

var repairDeadline = 0;

function undirEdgeKey(a, b) {
  return a < b ? a * 1000000 + b : b * 1000000 + a;
}

function computeNormal(V, a, b, c) {
  var v0 = V[a], v1 = V[b], v2 = V[c];
  var e1x = v1[0]-v0[0], e1y = v1[1]-v0[1], e1z = v1[2]-v0[2];
  var e2x = v2[0]-v0[0], e2y = v2[1]-v0[1], e2z = v2[2]-v0[2];
  var nx = e1y*e2z - e1z*e2y;
  var ny = e1z*e2x - e1x*e2z;
  var nz = e1x*e2y - e1y*e2x;
  var len = Math.sqrt(nx*nx + ny*ny + nz*nz);
  if (len < 1e-15) return [0, 0, 0];
  return [nx/len, ny/len, nz/len];
}

// ===== 診断 =====
function diagnose(V, T) {
  var undirEdges = new Map();
  for (var i = 0; i < T.length; i++) {
    var a = T[i][0], b = T[i][1], c = T[i][2];
    if (a === b || b === c || c === a) continue;
    var e1 = undirEdgeKey(a, b);
    var e2 = undirEdgeKey(b, c);
    var e3 = undirEdgeKey(c, a);
    undirEdges.set(e1, (undirEdges.get(e1) || 0) + 1);
    undirEdges.set(e2, (undirEdges.get(e2) || 0) + 1);
    undirEdges.set(e3, (undirEdges.get(e3) || 0) + 1);
  }
  var boundary = 0, nonManifold = 0;
  for (var cnt of undirEdges.values()) {
    if (cnt === 1) boundary++;
    else if (cnt > 2 && cnt !== 4) nonManifold++;
  }
  // 反対巻き重複ペア検出
  var triByUKey = new Map();
  for (var i = 0; i < T.length; i++) {
    var a = T[i][0], b = T[i][1], c = T[i][2];
    if (a === b || b === c || c === a) continue;
    var uk = unorderedKey(a, b, c);
    if (!triByUKey.has(uk)) triByUKey.set(uk, []);
    triByUKey.get(uk).push(i);
  }
  var oppositeWindingPairs = 0;
  for (var entry of triByUKey) {
    var tris = entry[1];
    if (tris.length < 2) continue;
    var windings = new Set();
    for (var ti of tris) windings.add(windingKey(T[ti][0], T[ti][1], T[ti][2]));
    if (windings.size >= 2) oppositeWindingPairs++;
  }
  // 巻き方向不整合エッジ数（manifoldエッジで同方向に横切る）
  var windingInconsistencies = 0;
  {
    var wdInfo = new Map();
    for (var i = 0; i < T.length; i++) {
      var a = T[i][0], b = T[i][1], c = T[i][2];
      if (a === b || b === c || c === a) continue;
      var we = [[a, b], [b, c], [c, a]];
      for (var e = 0; e < 3; e++) {
        var u = we[e][0], v = we[e][1];
        var wk = undirEdgeKey(u, v);
        if (!wdInfo.has(wk)) wdInfo.set(wk, [0, 0]);
        var wd = wdInfo.get(wk);
        if (u < v) wd[0]++; else wd[1]++;
      }
    }
    for (var wd of wdInfo.values()) {
      if (wd[0] + wd[1] !== 2) continue;
      if (wd[0] === 2 || wd[1] === 2) windingInconsistencies++;
    }
  }
  var components = findConnectedComponents(T).length;
  return { v: V.length, t: T.length, boundary: boundary, nonManifold: nonManifold, oppositeWindingPairs: oppositeWindingPairs, windingInconsistencies: windingInconsistencies, components: components, isWatertight: boundary === 0 && nonManifold === 0 };
}

// 軽量診断（NM + B のみ。WI/コンポーネント/OWP省略）
function quickDiagnose(V, T) {
  var undirEdges = new Map();
  for (var i = 0; i < T.length; i++) {
    var a = T[i][0], b = T[i][1], c = T[i][2];
    if (a === b || b === c || c === a) continue;
    var e1 = undirEdgeKey(a, b);
    var e2 = undirEdgeKey(b, c);
    var e3 = undirEdgeKey(c, a);
    undirEdges.set(e1, (undirEdges.get(e1) || 0) + 1);
    undirEdges.set(e2, (undirEdges.get(e2) || 0) + 1);
    undirEdges.set(e3, (undirEdges.get(e3) || 0) + 1);
  }
  var boundary = 0, nonManifold = 0;
  for (var cnt of undirEdges.values()) {
    if (cnt === 1) boundary++;
    else if (cnt > 2 && cnt !== 4) nonManifold++;
  }
  return { boundary: boundary, nonManifold: nonManifold, isWatertight: boundary === 0 && nonManifold === 0 };
}

// ===== Stage 0: 頂点マージ =====
function mergeVertices(vertices, triangles) {
  var vMap = new Map();
  var newV = [];
  var indexMap = new Array(vertices.length);
  var merged = 0;
  for (var i = 0; i < vertices.length; i++) {
    var k = vKey(vertices[i]);
    if (vMap.has(k)) {
      indexMap[i] = vMap.get(k);
      merged++;
    } else {
      indexMap[i] = newV.length;
      vMap.set(k, newV.length);
      newV.push(vertices[i]);
    }
  }
  var newT = [];
  for (var i = 0; i < triangles.length; i++) {
    var t = triangles[i];
    newT.push([indexMap[t[0]], indexMap[t[1]], indexMap[t[2]]]);
  }
  return { vertices: newV, triangles: newT, merged: merged };
}

// ===== Stage 1: 縮退三角形除去 =====
function removeDegenerateTriangles(vertices, triangles, threshold) {
  if (threshold === undefined) threshold = 1e-20;
  var result = [];
  var removed = 0;
  for (var i = 0; i < triangles.length; i++) {
    var a = triangles[i][0], b = triangles[i][1], c = triangles[i][2];
    if (a === b || b === c || c === a) { removed++; continue; }
    var v0 = vertices[a], v1 = vertices[b], v2 = vertices[c];
    var e1x = v1[0]-v0[0], e1y = v1[1]-v0[1], e1z = v1[2]-v0[2];
    var e2x = v2[0]-v0[0], e2y = v2[1]-v0[1], e2z = v2[2]-v0[2];
    var cx = e1y*e2z - e1z*e2y;
    var cy = e1z*e2x - e1x*e2z;
    var cz = e1x*e2y - e1y*e2x;
    if (cx*cx + cy*cy + cz*cz < threshold) { removed++; continue; }
    result.push([a, b, c]);
  }
  return { triangles: result, removed: removed };
}

// ===== 浮遊シェル除去 =====
function findConnectedComponents(triangles) {
  var n = triangles.length;
  if (n === 0) return [];
  var edgeMap = new Map();
  for (var i = 0; i < n; i++) {
    var a = triangles[i][0], b = triangles[i][1], c = triangles[i][2];
    var edges = [[a, b], [b, c], [c, a]];
    for (var e = 0; e < 3; e++) {
      var u = edges[e][0], v = edges[e][1];
      var key = u < v ? u + ',' + v : v + ',' + u;
      if (!edgeMap.has(key)) edgeMap.set(key, []);
      edgeMap.get(key).push(i);
    }
  }
  var visited = new Uint8Array(n);
  var components = [];
  for (var i = 0; i < n; i++) {
    if (visited[i]) continue;
    var component = [];
    var queue = [i];
    visited[i] = 1;
    while (queue.length > 0) {
      var ti = queue.pop();
      component.push(ti);
      var a = triangles[ti][0], b = triangles[ti][1], c = triangles[ti][2];
      var edges = [[a, b], [b, c], [c, a]];
      for (var e = 0; e < 3; e++) {
        var u = edges[e][0], v = edges[e][1];
        var key = u < v ? u + ',' + v : v + ',' + u;
        var neighbors = edgeMap.get(key);
        if (!neighbors) continue;
        for (var ni = 0; ni < neighbors.length; ni++) {
          if (!visited[neighbors[ni]]) {
            visited[neighbors[ni]] = 1;
            queue.push(neighbors[ni]);
          }
        }
      }
    }
    components.push(component);
  }
  return components;
}

function removeSmallShells(vertices, triangles, threshold) {
  var components = findConnectedComponents(triangles);
  if (components.length <= 1) return { vertices: vertices, triangles: triangles, removed: 0 };
  var totalArea = 0;
  var compAreas = new Array(components.length);
  for (var ci = 0; ci < components.length; ci++) {
    var area = 0;
    for (var j = 0; j < components[ci].length; j++) {
      var ti = components[ci][j];
      var a = triangles[ti][0], b = triangles[ti][1], c = triangles[ti][2];
      var ax = vertices[a][0], ay = vertices[a][1], az = vertices[a][2];
      var bx = vertices[b][0], by = vertices[b][1], bz = vertices[b][2];
      var cx = vertices[c][0], cy = vertices[c][1], cz = vertices[c][2];
      var e1x = bx-ax, e1y = by-ay, e1z = bz-az;
      var e2x = cx-ax, e2y = cy-ay, e2z = cz-az;
      var nx = e1y*e2z - e1z*e2y, ny = e1z*e2x - e1x*e2z, nz = e1x*e2y - e1y*e2x;
      area += Math.sqrt(nx*nx + ny*ny + nz*nz) * 0.5;
    }
    compAreas[ci] = area;
    totalArea += area;
  }
  var removeTris = new Set();
  var removed = 0;
  for (var ci = 0; ci < components.length; ci++) {
    if (compAreas[ci] < totalArea * threshold) {
      for (var j = 0; j < components[ci].length; j++) removeTris.add(components[ci][j]);
      removed++;
    }
  }
  if (removeTris.size === 0) return { vertices: vertices, triangles: triangles, removed: 0 };
  var newTris = [];
  for (var i = 0; i < triangles.length; i++) {
    if (!removeTris.has(i)) newTris.push(triangles[i]);
  }
  var usedVerts = new Set();
  for (var i = 0; i < newTris.length; i++) {
    usedVerts.add(newTris[i][0]); usedVerts.add(newTris[i][1]); usedVerts.add(newTris[i][2]);
  }
  var sortedVerts = Array.from(usedVerts).sort(function(a,b){return a-b;});
  var vertMap = new Map();
  var newVerts = [];
  for (var i = 0; i < sortedVerts.length; i++) {
    vertMap.set(sortedVerts[i], newVerts.length);
    newVerts.push(vertices[sortedVerts[i]]);
  }
  var remappedTris = [];
  for (var i = 0; i < newTris.length; i++) {
    remappedTris.push([vertMap.get(newTris[i][0]), vertMap.get(newTris[i][1]), vertMap.get(newTris[i][2])]);
  }
  return { vertices: newVerts, triangles: remappedTris, removed: removed };
}

// ===== Stage 2: 反対巻き重複面除去 =====
function removeOppositeWindingDuplicates(triangles) {
  var groups = new Map();
  for (var i = 0; i < triangles.length; i++) {
    var a = triangles[i][0], b = triangles[i][1], c = triangles[i][2];
    var uk = unorderedKey(a, b, c);
    if (!groups.has(uk)) groups.set(uk, []);
    groups.get(uk).push(i);
  }
  var toRemove = new Set();
  var pairsRemoved = 0;
  for (var entry of groups) {
    var indices = entry[1];
    if (indices.length < 2) continue;
    var byWinding = new Map();
    for (var idx of indices) {
      var a = triangles[idx][0], b = triangles[idx][1], c = triangles[idx][2];
      var wk = windingKey(a, b, c);
      if (!byWinding.has(wk)) byWinding.set(wk, []);
      byWinding.get(wk).push(idx);
    }
    if (byWinding.size >= 2) {
      var windingArrays = Array.from(byWinding.values());
      var classA = windingArrays[0];
      var classB = windingArrays[1];
      var pairs = Math.min(classA.length, classB.length);
      for (var j = 0; j < pairs; j++) {
        toRemove.add(classA[j]);
        toRemove.add(classB[j]);
        pairsRemoved++;
      }
    }
  }
  if (toRemove.size === 0) return { triangles: triangles, pairsRemoved: 0 };
  var result = [];
  for (var i = 0; i < triangles.length; i++) {
    if (!toRemove.has(i)) result.push(triangles[i]);
  }
  return { triangles: result, pairsRemoved: pairsRemoved };
}

// ===== Stage 3: 完全重複除去 =====
function removeExactDuplicates(triangles) {
  var seen = new Set();
  var result = [];
  var removed = 0;
  for (var i = 0; i < triangles.length; i++) {
    var a = triangles[i][0], b = triangles[i][1], c = triangles[i][2];
    var wk = windingKey(a, b, c);
    if (seen.has(wk)) { removed++; continue; }
    seen.add(wk);
    result.push([a, b, c]);
  }
  return { triangles: result, removed: removed };
}

// ===== Stage 4: 法線整合性 =====
function enforceNormalConsistency(vertices, triangles, skipVolumeTest) {
  var n = triangles.length;
  if (n === 0) return { triangles: triangles, flipped: 0 };

  var edgeMap = new Map();
  for (var i = 0; i < n; i++) {
    var a = triangles[i][0], b = triangles[i][1], c = triangles[i][2];
    var edges = [[a,b],[b,c],[c,a]];
    for (var e = 0; e < 3; e++) {
      var u = edges[e][0], v = edges[e][1];
      var k = undirEdgeKey(u, v);
      if (!edgeMap.has(k)) edgeMap.set(k, { fwd: [], rev: [] });
      var entry = edgeMap.get(k);
      if (u < v) entry.fwd.push(i);
      else entry.rev.push(i);
    }
  }

  var adj = new Array(n);
  for (var i = 0; i < n; i++) adj[i] = [];

  for (var entry of edgeMap) {
    var fwd = entry[1].fwd, rev = entry[1].rev;
    var edgeTotal = fwd.length + rev.length;
    if (edgeTotal === 4) continue;
    for (var fi = 0; fi < fwd.length; fi++) {
      for (var ri = 0; ri < rev.length; ri++) {
        if (fwd[fi] !== rev[ri]) {
          adj[fwd[fi]].push({ neighbor: rev[ri], consistent: true });
          adj[rev[ri]].push({ neighbor: fwd[fi], consistent: true });
        }
      }
    }
    for (var i = 0; i < fwd.length; i++) {
      for (var j = i+1; j < fwd.length; j++) {
        adj[fwd[i]].push({ neighbor: fwd[j], consistent: false });
        adj[fwd[j]].push({ neighbor: fwd[i], consistent: false });
      }
    }
    for (var i = 0; i < rev.length; i++) {
      for (var j = i+1; j < rev.length; j++) {
        adj[rev[i]].push({ neighbor: rev[j], consistent: false });
        adj[rev[j]].push({ neighbor: rev[i], consistent: false });
      }
    }
  }

  var orientation = new Int8Array(n);
  var totalFlipped = 0;

  for (var seed = 0; seed < n; seed++) {
    if (orientation[seed] !== 0) continue;
    orientation[seed] = 1;
    var componentTris = [seed];
    var queue = [seed];
    while (queue.length > 0) {
      var current = queue.shift();
      var curFlip = orientation[current] === 2;
      for (var ai = 0; ai < adj[current].length; ai++) {
        var nb = adj[current][ai].neighbor;
        var consistent = adj[current][ai].consistent;
        if (orientation[nb] !== 0) continue;
        if (curFlip !== !consistent) {
          orientation[nb] = 2;
        } else {
          orientation[nb] = 1;
        }
        componentTris.push(nb);
        queue.push(nb);
      }
    }
    var volume = 0;
    for (var ci = 0; ci < componentTris.length; ci++) {
      var ti = componentTris[ci];
      var a = triangles[ti][0], b = triangles[ti][1], c = triangles[ti][2];
      if (orientation[ti] === 2) { var tmp = b; b = c; c = tmp; }
      var v0 = vertices[a], v1 = vertices[b], v2 = vertices[c];
      volume += v0[0]*(v1[1]*v2[2]-v1[2]*v2[1])
              + v0[1]*(v1[2]*v2[0]-v1[0]*v2[2])
              + v0[2]*(v1[0]*v2[1]-v1[1]*v2[0]);
    }
    if (!skipVolumeTest && volume < 0) {
      for (var ci = 0; ci < componentTris.length; ci++) {
        var ti = componentTris[ci];
        orientation[ti] = orientation[ti] === 1 ? 2 : 1;
      }
    }
  }

  var result = [];
  for (var i = 0; i < n; i++) {
    var a = triangles[i][0], b = triangles[i][1], c = triangles[i][2];
    if (orientation[i] === 2) {
      result.push([a, c, b]);
      totalFlipped++;
    } else {
      result.push([a, b, c]);
    }
  }
  return { triangles: result, flipped: totalFlipped };
}

// 巻き方向不整合エッジ数をカウント
function countWindingInconsistencies(triangles) {
  var edgeInfo = new Map();
  for (var i = 0; i < triangles.length; i++) {
    var a = triangles[i][0], b = triangles[i][1], c = triangles[i][2];
    var edges = [[a, b], [b, c], [c, a]];
    for (var e = 0; e < 3; e++) {
      var u = edges[e][0], v = edges[e][1];
      var k = undirEdgeKey(u, v);
      if (!edgeInfo.has(k)) edgeInfo.set(k, { fwd: [], rev: [] });
      var entry = edgeInfo.get(k);
      if (u < v) entry.fwd.push(i); else entry.rev.push(i);
    }
  }
  var count = 0;
  for (var entry of edgeInfo) {
    var info = entry[1];
    if (info.fwd.length + info.rev.length !== 2) continue;
    if (info.fwd.length === 2 || info.rev.length === 2) count++;
  }
  return count;
}

// 巻き方向不整合をエッジフリップ+三角形フリップで修正
function fixWindingByEdgeFlip(vertices, triangles, maxPasses) {
  if (maxPasses === undefined) maxPasses = 20;
  if (maxPasses > 50) maxPasses = 50;
  var T = [];
  for (var i = 0; i < triangles.length; i++) T.push([triangles[i][0], triangles[i][1], triangles[i][2]]);
  var totalFixed = 0;
  var prevWI = Infinity;
  var stagnantCount = 0;

  for (var pass = 0; pass < maxPasses; pass++) {
    if (repairDeadline > 0 && Date.now() > repairDeadline) break;
    // 不整合エッジを検出
    var edgeInfo = new Map();
    for (var i = 0; i < T.length; i++) {
      var a = T[i][0], b = T[i][1], c = T[i][2];
      var edges = [[a, b], [b, c], [c, a]];
      for (var e = 0; e < 3; e++) {
        var u = edges[e][0], v = edges[e][1];
        var k = undirEdgeKey(u, v);
        if (!edgeInfo.has(k)) edgeInfo.set(k, { fwd: [], rev: [] });
        var entry = edgeInfo.get(k);
        if (u < v) entry.fwd.push(i); else entry.rev.push(i);
      }
    }

    var inconEdges = [];
    var inconTris = new Set();
    for (var entry of edgeInfo) {
      var k = entry[0], info = entry[1];
      if (info.fwd.length + info.rev.length !== 2) continue;
      if (info.fwd.length === 2 || info.rev.length === 2) {
        var pair = info.fwd.length === 2 ? info.fwd : info.rev;

      intersectingVerts.add(a); intersectingVerts.add(b); intersectingVerts.add(c);
    }
    for (var i = 0; i < triangles.length; i++) {
      if (toRemove.has(i)) continue;
      var a=triangles[i][0],b=triangles[i][1],c=triangles[i][2];
      if (intersectingVerts.has(a)||intersectingVerts.has(b)||intersectingVerts.has(c)) toRemove.add(i);
    }
    var prevCount = triangles.length;
    var newTris = [];
    for (var i = 0; i < triangles.length; i++) {
      if (!toRemove.has(i)) newTris.push(triangles[i]);
    }
    triangles = newTris;
    if (prevCount - triangles.length === 0) break;
    var fillResult = fillAllHoles(vertices, triangles, holeMaxTriArea);
    vertices = fillResult.vertices;
    triangles = fillResult.triangles;
    totalRepaired += pairs.length;
    var newPairs = detectSelfIntersections(vertices, triangles);
    if (newPairs.length >= pairs.length) break;
  }
  return { vertices: vertices, triangles: triangles, repaired: totalRepaired };
}

function buildEdgeCounts(T) {
  var counts = new Map();
  for (var i = 0; i < T.length; i++) {
    var a = T[i][0], b = T[i][1], c = T[i][2];
    var pairs = [[a,b],[b,c],[c,a]];
    for (var j = 0; j < 3; j++) {
      var k = undirEdgeKey(pairs[j][0], pairs[j][1]);
      counts.set(k, (counts.get(k) || 0) + 1);
    }
  }
  return counts;
}

// ===== Stage 6: 非多様体頂点解決 =====
function resolveNonManifoldVertices(vertices, triangles) {
  var totalSplit = 0;
  var vertexTris = new Map();
  for (var i = 0; i < triangles.length; i++) {
    var tri = triangles[i];
    for (var vi = 0; vi < 3; vi++) {
      var v = tri[vi];
      if (!vertexTris.has(v)) vertexTris.set(v, []);
      vertexTris.get(v).push(i);
    }
  }
  for (var entry of vertexTris) {
    var v = entry[0], triIndices = entry[1];
    if (triIndices.length < 2) continue;
    var edgeToTris = new Map();
    for (var idx of triIndices) {
      var tri = triangles[idx];
      var others = [];
      if (tri[0] !== v) others.push(tri[0]);
      if (tri[1] !== v) others.push(tri[1]);
      if (tri[2] !== v) others.push(tri[2]);
      for (var w of others) {
        var ek = undirEdgeKey(v, w);
        if (!edgeToTris.has(ek)) edgeToTris.set(ek, []);
        edgeToTris.get(ek).push(idx);
      }
    }
    var localAdj = new Map();
    for (var idx of triIndices) localAdj.set(idx, new Set());
    for (var etEntry of edgeToTris) {
      var tris = etEntry[1];
      for (var i = 0; i < tris.length; i++) {
        for (var j = i+1; j < tris.length; j++) {
          localAdj.get(tris[i]).add(tris[j]);
          localAdj.get(tris[j]).add(tris[i]);
        }
      }
    }
    var visited = new Set();
    var components = [];
    for (var idx of triIndices) {
      if (visited.has(idx)) continue;
      var comp = [];
      var queue = [idx];
      visited.add(idx);
      while (queue.length > 0) {
        var cur = queue.shift();
        comp.push(cur);
        for (var nb of localAdj.get(cur)) {
          if (!visited.has(nb)) { visited.add(nb); queue.push(nb); }
        }
      }
      components.push(comp);
    }
    if (components.length <= 1) continue;
    for (var ci = 1; ci < components.length; ci++) {
      var newIdx = vertices.length;
      vertices.push([vertices[v][0], vertices[v][1], vertices[v][2]]);
      totalSplit++;
      for (var ti of components[ci]) {
        var tri = triangles[ti];
        if (tri[0] === v) tri[0] = newIdx;
        if (tri[1] === v) tri[1] = newIdx;
        if (tri[2] === v) tri[2] = newIdx;
      }
    }
  }
  return { vertices: vertices, triangles: triangles, split: totalSplit };
}

// ===== Stage 7: 穴埋め =====
function getBoundaryEdges(triangles) {
  var edgeCount = new Map();
  var edgeDir = new Map();
  for (var i = 0; i < triangles.length; i++) {
    var a = triangles[i][0], b = triangles[i][1], c = triangles[i][2];
    countEdge(edgeCount, edgeDir, a, b);
    countEdge(edgeCount, edgeDir, b, c);
    countEdge(edgeCount, edgeDir, c, a);
  }
  var boundary = [];
  for (var entry of edgeCount) {
    var k = entry[0], cnt = entry[1];
    if (cnt === 1) {
      var a = Math.floor(k / 1000000);
      var b = k % 1000000;
      boundary.push(edgeDir.get(k) === 1 ? [b, a] : [a, b]);
    }
  }
  return boundary;
}

function countEdge(cntMap, dirMap, a, b) {
  var k = undirEdgeKey(a, b);
  cntMap.set(k, (cntMap.get(k) || 0) + 1);
  dirMap.set(k, a < b ? 1 : 0);
}

function findAllLoops(edges) {
  if (edges.length === 0) return [];
  var loops = [];
  var edgeUsed = new Uint8Array(edges.length);
  var outMap = new Map();
  for (var i = 0; i < edges.length; i++) {
    var a = edges[i][0], b = edges[i][1];
    if (!outMap.has(a)) outMap.set(a, []);
    outMap.get(a).push({ to: b, idx: i });
  }
  for (var startIdx = 0; startIdx < edges.length; startIdx++) {
    if (edgeUsed[startIdx]) continue;
    var start = edges[startIdx][0];
    var next = edges[startIdx][1];
    edgeUsed[startIdx] = 1;
    var path = [start];
    var current = next;
    var found = false;
    for (var step = 0; step < 300; step++) {
      if (current === start) {
        if (path.length >= 3) found = true;
        break;
      }
      var existingIdx = path.indexOf(current);
      if (existingIdx >= 0) {
        var innerLoop = path.slice(existingIdx);
        if (innerLoop.length >= 3) loops.push(innerLoop);
        path.length = existingIdx + 1;
      } else {
        path.push(current);
      }
      var outs = outMap.get(current) || [];
      var advanced = false;
      for (var i = 0; i < outs.length; i++) {
        if (!edgeUsed[outs[i].idx]) {
          edgeUsed[outs[i].idx] = 1;
          current = outs[i].to;
          advanced = true;
          break;
        }
      }
      if (!advanced) break;
    }
    if (found) loops.push(path);
  }
  return loops;
}

function fillTJunction(boundary) {
  var outEdges = new Map();
  var inEdges = new Map();
  for (var i = 0; i < boundary.length; i++) {
    var a = boundary[i][0], b = boundary[i][1];
    if (!outEdges.has(a)) outEdges.set(a, []);
    if (!inEdges.has(b)) inEdges.set(b, []);
    outEdges.get(a).push(b);
    inEdges.get(b).push(a);
  }
  for (var entry of outEdges) {
    if (entry[1].length >= 2) return [entry[0], entry[1][1], entry[1][0]];
  }
  for (var entry of inEdges) {
    if (entry[1].length >= 2) return [entry[0], entry[1][0], entry[1][1]];
  }
  return null;
}

// 開いたチェーンを検出（ループを形成しない境界エッジの連鎖）
function findOpenChain(boundary) {
  if (boundary.length === 0) return null;
  var outMap = new Map();
  var inMap = new Map();
  for (var i = 0; i < boundary.length; i++) {
    outMap.set(boundary[i][0], boundary[i][1]);
    inMap.set(boundary[i][1], boundary[i][0]);
  }
  var start = -1;
  for (var i = 0; i < boundary.length; i++) {
    if (!inMap.has(boundary[i][0])) { start = boundary[i][0]; break; }
  }
  if (start === -1) return null;
  var chain = [start];
  var current = start;
  for (var step = 0; step < boundary.length + 1; step++) {
    if (!outMap.has(current)) break;
    current = outMap.get(current);
    if (current === start) break;
    chain.push(current);
  }
  if (chain.length >= 3) return chain;
  return null;
}

// 穴埋めヘルパー：全穴をear-clippingで埋める
function fillAllHoles(vertices, triangles, maxTriAreaOverride) {
  var T = triangles.slice();
  var maxArea = maxTriAreaOverride || 0;
  if (maxArea <= 0) {
    var totalArea = 0;
    for (var i = 0; i < T.length; i++) totalArea += triArea3D(vertices, T[i][0], T[i][1], T[i][2]);
    var avgArea = T.length > 0 ? totalArea / T.length : 1;
    maxArea = avgArea * 100;
  }
  var filled = 0;
  var lastB = Infinity, stuck = 0;
  for (var iter = 0; iter < 10000; iter++) {
    if (repairDeadline > 0 && Date.now() > repairDeadline) break;
    var bnd = getBoundaryEdges(T);
    if (bnd.length === 0) break;
    if (bnd.length >= lastB) { stuck++; if (stuck > 10) break; } else stuck = 0;
    lastB = bnd.length;
    var loops = findAllLoops(bnd);
    var ok = false;
    if (loops.length > 0) {
      loops.sort(function(a, b) { return a.length - b.length; });
      for (var li = 0; li < loops.length; li++) {
        if (loops[li].length < 3) continue;
        var nt = fillHoleEarClipping(vertices, loops[li], maxArea);
        if (nt.length > 0) { for (var j = 0; j < nt.length; j++) T.push(nt[j]); filled++; ok = true; break; }
      }
    }
    if (!ok) {
      var frc = fillTJunction(bnd);
      if (frc && triArea3D(vertices, frc[0], frc[1], frc[2]) <= maxArea) { T.push(frc); filled++; ok = true; }
    }
    if (!ok) {
      var ch = findOpenChain(bnd);
      if (ch && ch.length >= 3) {
        var nt2 = fillHoleEarClipping(vertices, ch, maxArea);
        if (nt2.length > 0) { for (var j2 = 0; j2 < nt2.length; j2++) T.push(nt2[j2]); filled++; ok = true; }
      }
    }
    if (!ok) break;
  }
  return { vertices: vertices, triangles: T, filled: filled };
}

function pointInTriangle2D(p, a, b, c) {
  var d1 = (p[0]-c[0])*(a[1]-c[1]) - (a[0]-c[0])*(p[1]-c[1]);
  var d2 = (p[0]-a[0])*(b[1]-a[1]) - (b[0]-a[0])*(p[1]-a[1]);
  var d3 = (p[0]-b[0])*(c[1]-b[1]) - (c[0]-b[0])*(p[1]-b[1]);
  var hasNeg = (d1 < 0) || (d2 < 0) || (d3 < 0);
  var hasPos = (d1 > 0) || (d2 > 0) || (d3 > 0);
  return !(hasNeg && hasPos);
}

function fillHoleEarClipping(V, loop, maxTriArea) {
  var n = loop.length;
  if (n < 3) return [];
  if (n === 3) {
    if (maxTriArea && triArea3D(V, loop[0], loop[1], loop[2]) > maxTriArea) return [];
    return [[loop[0], loop[1], loop[2]]];
  }
  var nx = 0, ny = 0, nz = 0;
  for (var i = 0; i < n; i++) {
    var curr = V[loop[i]];
    var next = V[loop[(i+1)%n]];
    nx += (curr[1]-next[1])*(curr[2]+next[2]);
    ny += (curr[2]-next[2])*(curr[0]+next[0]);
    nz += (curr[0]-next[0])*(curr[1]+next[1]);
  }
  var nLen = Math.sqrt(nx*nx + ny*ny + nz*nz);
  if (nLen < 1e-15) return fillHoleFan(V, loop, maxTriArea);
  nx /= nLen; ny /= nLen; nz /= nLen;
  var ux, uy, uz;
  if (Math.abs(nz) < 0.9) { ux = ny; uy = -nx; uz = 0; }
  else { ux = 0; uy = nz; uz = -ny; }
  var uLen = Math.sqrt(ux*ux + uy*uy + uz*uz);
  ux /= uLen; uy /= uLen; uz /= uLen;
  var vx = ny*uz - nz*uy;
  var vy = nz*ux - nx*uz;
  var vz = nx*uy - ny*ux;
  var pts = new Array(n);
  for (var i = 0; i < n; i++) {
    var p = V[loop[i]];
    pts[i] = [p[0]*ux + p[1]*uy + p[2]*uz, p[0]*vx + p[1]*vy + p[2]*vz];
  }
  var result = [];
  var indices = [];
  for (var i = 0; i < n; i++) indices.push(i);
  var maxIter = n * n;
  var iterCount = 0;
  while (indices.length > 3 && iterCount < maxIter) {
    iterCount++;
    var len = indices.length;
    var earFound = false;
    for (var i = 0; i < len; i++) {
      var prevI = (i - 1 + len) % len;
      var nextI = (i + 1) % len;
      var pi = indices[prevI], ci = indices[i], ni = indices[nextI];
      var cross = (pts[ci][0]-pts[pi][0])*(pts[ni][1]-pts[pi][1]) - (pts[ci][1]-pts[pi][1])*(pts[ni][0]-pts[pi][0]);
      if (cross <= 0) continue;
      if (maxTriArea && triArea3D(V, loop[pi], loop[ci], loop[ni]) > maxTriArea) continue;
      var isEar = true;
      for (var j = 0; j < len; j++) {
        if (j === prevI || j === i || j === nextI) continue;
        if (pointInTriangle2D(pts[indices[j]], pts[pi], pts[ci], pts[ni])) { isEar = false; break; }
      }
      if (isEar) {
        result.push([loop[pi], loop[ci], loop[ni]]);
        indices.splice(i, 1);
        earFound = true;
        break;
      }
    }
    if (!earFound) break;
  }
  if (indices.length === 3) {
    if (!maxTriArea || triArea3D(V, loop[indices[0]], loop[indices[1]], loop[indices[2]]) <= maxTriArea) {
      result.push([loop[indices[0]], loop[indices[1]], loop[indices[2]]]);
    }
  } else if (indices.length > 3) {
    for (var i = 1; i < indices.length - 1; i++) {
      if (maxTriArea && triArea3D(V, loop[indices[0]], loop[indices[i]], loop[indices[i+1]]) > maxTriArea) continue;
      result.push([loop[indices[0]], loop[indices[i]], loop[indices[i+1]]]);
    }
  }
  return result;
}

function fillHoleFan(V, loop, maxTriArea) {
  var n = loop.length;
  if (n < 3) return [];
  if (n === 3) {
    if (maxTriArea && triArea3D(V, loop[0], loop[1], loop[2]) > maxTriArea) return [];
    return [[loop[0], loop[1], loop[2]]];
  }
  var cx = 0, cy = 0, cz = 0;
  for (var i = 0; i < n; i++) {
    cx += V[loop[i]][0]; cy += V[loop[i]][1]; cz += V[loop[i]][2];
  }
  V.push([cx/n, cy/n, cz/n]);
  var ci = V.length - 1;
  var tris = [];
  for (var i = 0; i < n; i++) {
    var tri = [loop[i], loop[(i+1)%n], ci];
    if (maxTriArea && triArea3D(V, tri[0], tri[1], tri[2]) > maxTriArea) continue;
    tris.push(tri);
  }
  if (tris.length === 0) V.pop();
  return tris;
}

function triArea3D(V, a, b, c) {
  var va=V[a],vb=V[b],vc=V[c];
  var ex=vb[0]-va[0],ey=vb[1]-va[1],ez=vb[2]-va[2];
  var fx=vc[0]-va[0],fy=vc[1]-va[1],fz=vc[2]-va[2];
  var gx=ey*fz-ez*fy,gy=ez*fx-ex*fz,gz=ex*fy-ey*fx;
  return 0.5*Math.sqrt(gx*gx+gy*gy+gz*gz);
}

function subdivideLongBoundaryEdges(vertices, triangles, maxTriArea) {
  var V = vertices, T = triangles, splitCount = 0;
  for (var pass = 0; pass < 500; pass++) {
    if (repairDeadline > 0 && Date.now() > repairDeadline) break;
    var edgeMap = new Map();
    for (var i = 0; i < T.length; i++) {
      var ta = T[i][0], tb = T[i][1], tc = T[i][2];
      var pairs = [[ta,tb],[tb,tc],[tc,ta]];
      for (var pi = 0; pi < 3; pi++) {
        var k = undirEdgeKey(pairs[pi][0], pairs[pi][1]);
        if (!edgeMap.has(k)) edgeMap.set(k, []);
        edgeMap.get(k).push(i);
      }
    }
    var boundary = getBoundaryEdges(T);
    if (boundary.length === 0) break;
    var loops = findAllLoops(boundary);
    var splitEdgeKey = -1, splitU = -1, splitV = -1;
    for (var li = 0; li < loops.length; li++) {
      var loop = loops[li];
      if (loop.length < 3) continue;
      var loopArea = 0;
      for (var j = 1; j < loop.length - 1; j++) loopArea += triArea3D(V, loop[0], loop[j], loop[j+1]);
      var numEars = loop.length - 2;
      var estMax = numEars > 0 ? loopArea / numEars * 3 : 0;
      if (estMax > maxTriArea) {
        var bestLen = 0;
        for (var j2 = 0; j2 < loop.length; j2++) {
          var u = loop[j2], v = loop[(j2 + 1) % loop.length];
          var dx = V[u][0]-V[v][0], dy = V[u][1]-V[v][1], dz = V[u][2]-V[v][2];
          var len = dx*dx + dy*dy + dz*dz;
          if (len > bestLen) { bestLen = len; splitU = u; splitV = v; splitEdgeKey = undirEdgeKey(u, v); }
        }
        break;
      }
    }
    if (splitEdgeKey === -1) {
      var chain = findOpenChain(boundary);
      if (chain && chain.length >= 3) {
        var chainArea = 0;
        for (var j3 = 1; j3 < chain.length - 1; j3++) chainArea += triArea3D(V, chain[0], chain[j3], chain[j3+1]);
        var numEars2 = chain.length - 2;
        var estMax2 = numEars2 > 0 ? chainArea / numEars2 * 3 : 0;
        if (estMax2 > maxTriArea) {
          var bestLen2 = 0;
          for (var j4 = 0; j4 < chain.length - 1; j4++) {
            var u2 = chain[j4], v2 = chain[j4 + 1];
            var dx2 = V[u2][0]-V[v2][0], dy2 = V[u2][1]-V[v2][1], dz2 = V[u2][2]-V[v2][2];
            var len2 = dx2*dx2 + dy2*dy2 + dz2*dz2;
            if (len2 > bestLen2) { bestLen2 = len2; splitU = u2; splitV = v2; splitEdgeKey = undirEdgeKey(u2, v2); }
          }
        }
      }
    }
    if (splitEdgeKey === -1) break;
    var mi = V.length;
    V.push([(V[splitU][0]+V[splitV][0])/2, (V[splitU][1]+V[splitV][1])/2, (V[splitU][2]+V[splitV][2])/2]);
    var tris = edgeMap.get(splitEdgeKey) || [];
    for (var ti = 0; ti < tris.length; ti++) {
      var triIdx = tris[ti];
      var tA = T[triIdx][0], tB = T[triIdx][1], tC = T[triIdx][2];
      var perms = [[tA,tB,tC],[tB,tC,tA],[tC,tA,tB]];
      for (var pi2 = 0; pi2 < 3; pi2++) {
        var p0 = perms[pi2][0], p1 = perms[pi2][1], p2 = perms[pi2][2];
        if ((p0 === splitU && p1 === splitV) || (p0 === splitV && p1 === splitU)) {
          T[triIdx] = [p0, mi, p2]; T.push([mi, p1, p2]); break;
        }
      }
    }
    splitCount++;
  }
  return { vertices: V, triangles: T, splitCount: splitCount };
}

function subdivideOversizedTriangles(vertices, triangles, maxTriArea) {
  var V = vertices;
  var T = triangles;
  if (!maxTriArea || maxTriArea <= 0) {
    var totalA = 0;
    for (var i = 0; i < T.length; i++) totalA += triArea3D(V, T[i][0], T[i][1], T[i][2]);
    maxTriArea = T.length > 0 ? (totalA / T.length) * 20 : 1;
  }
  var buildEdgeMap = function() {
    var em = new Map();
    for (var i = 0; i < T.length; i++) {
      var a=T[i][0],b=T[i][1],c=T[i][2];
      var edges = [[a,b],[b,c],[c,a]];
      for (var j=0;j<3;j++) {
        var u=edges[j][0],v=edges[j][1];
        var k = u < v ? u * 1000000 + v : v * 1000000 + u;
        if (!em.has(k)) em.set(k, []);
        em.get(k).push(i);
      }
    }
    return em;
  };
  var edgeMap = buildEdgeMap();
  var splitCount = 0;
  var maxIter = T.length * 3;
  for (var iter = 0; iter < maxIter; iter++) {
    if (repairDeadline > 0 && Date.now() > repairDeadline) break;
    var worstIdx = -1, worstArea = maxTriArea;
    for (var i = 0; i < T.length; i++) {
      var area = triArea3D(V, T[i][0], T[i][1], T[i][2]);
      if (area > worstArea) { worstArea = area; worstIdx = i; }
    }
    if (worstIdx === -1) break;
    var a=T[worstIdx][0],b=T[worstIdx][1],c=T[worstIdx][2];
    var d2 = function(u, v) {
      var dx=V[u][0]-V[v][0],dy=V[u][1]-V[v][1],dz=V[u][2]-V[v][2];
      return dx*dx+dy*dy+dz*dz;
    };
    var isBE = function(u, v) {
      var k = u < v ? u * 1000000 + v : v * 1000000 + u;
      return (edgeMap.get(k) || []).length === 1;
    };
    var candidates = [[a,b,c],[b,c,a],[c,a,b]].filter(function(e){return !isBE(e[0],e[1]);});
    if (candidates.length === 0) break;
    var eu,ev,ew,bestDist = -1;
    for (var ci2=0;ci2<candidates.length;ci2++) {
      var d = d2(candidates[ci2][0], candidates[ci2][1]);
      if (d > bestDist) { bestDist = d; eu = candidates[ci2][0]; ev = candidates[ci2][1]; ew = candidates[ci2][2]; }
    }
    var mi = V.length;
    V.push([(V[eu][0]+V[ev][0])/2,(V[eu][1]+V[ev][1])/2,(V[eu][2]+V[ev][2])/2]);
    T[worstIdx] = [eu, mi, ew];
    T.push([mi, ev, ew]);
    var ek = eu < ev ? eu * 1000000 + ev : ev * 1000000 + eu;
    var neighbors = edgeMap.get(ek) || [];
    for (var ni = 0; ni < neighbors.length; ni++) {
      var nIdx = neighbors[ni];
      if (nIdx === worstIdx) continue;
      var na=T[nIdx][0],nb=T[nIdx][1],nc=T[nIdx][2];
      var rotations = [[na,nb,nc],[nb,nc,na],[nc,na,nb]];
      for (var ri=0;ri<3;ri++) {
        var p0=rotations[ri][0],p1=rotations[ri][1],p2=rotations[ri][2];
        if (p0===ev && p1===eu) {
          T[nIdx] = [ev, mi, p2];
          T.push([mi, eu, p2]);
          break;
        }
        if (p0===eu && p1===ev) {
          T[nIdx] = [eu, mi, p2];
          T.push([mi, ev, p2]);
          break;
        }
      }
    }
    splitCount++;
    edgeMap = buildEdgeMap();
  }
  return { vertices: V, triangles: T, splitCount: splitCount };
}

function averageEdgeLength(V, T) {
  var totalLen = 0, count = 0;
  for (var i = 0; i < T.length; i++) {
    var a=T[i][0],b=T[i][1],c=T[i][2];
    var edges=[[a,b],[b,c],[c,a]];
    for (var e = 0; e < 3; e++) {
      var u=edges[e][0],v=edges[e][1];
      var dx=V[u][0]-V[v][0],dy=V[u][1]-V[v][1],dz=V[u][2]-V[v][2];
      totalLen+=Math.sqrt(dx*dx+dy*dy+dz*dz); count++;
    }
  }
  return count > 0 ? totalLen / count : 1;
}

// ===== 適応的パラメータ =====
function analyzeScale(V, T) {
  var minX = Infinity, maxX = -Infinity;
  var minY = Infinity, maxY = -Infinity;
  var minZ = Infinity, maxZ = -Infinity;
  for (var i = 0; i < V.length; i++) {
    var v = V[i];
    if (v[0] < minX) minX = v[0]; if (v[0] > maxX) maxX = v[0];
    if (v[1] < minY) minY = v[1]; if (v[1] > maxY) maxY = v[1];
    if (v[2] < minZ) minZ = v[2]; if (v[2] > maxZ) maxZ = v[2];
  }
  var dx = maxX - minX, dy = maxY - minY, dz = maxZ - minZ;
  var bboxDiag = Math.sqrt(dx * dx + dy * dy + dz * dz);
  var totalArea = 0;
  var edgeLens = [];
  var seen = new Set();
  for (var i = 0; i < T.length; i++) {
    totalArea += triArea3D(V, T[i][0], T[i][1], T[i][2]);
    var a = T[i][0], b = T[i][1], c = T[i][2];
    var pairs = [[a,b],[b,c],[c,a]];
    for (var j = 0; j < 3; j++) {
      var u = pairs[j][0], v2 = pairs[j][1];
      var k = undirEdgeKey(u, v2);
      if (seen.has(k)) continue;
      seen.add(k);
      var ex = V[u][0]-V[v2][0], ey = V[u][1]-V[v2][1], ez = V[u][2]-V[v2][2];
      edgeLens.push(Math.sqrt(ex*ex+ey*ey+ez*ez));
    }
  }
  edgeLens.sort(function(a,b){return a-b;});
  var medianEdge = edgeLens.length > 0 ? edgeLens[Math.floor(edgeLens.length/2)] : 1;
  var avgArea = T.length > 0 ? totalArea / T.length : 1;
  return { bboxDiag: bboxDiag, medianEdge: medianEdge, avgArea: avgArea, totalArea: totalArea, triCount: T.length };
}

// ===== Deep Repair (ボクセル再構築) =====

function pointToTriangleDistance(p, V, a, b, c) {
  var v0 = V[a], v1 = V[b], v2 = V[c];
  var e0x = v1[0]-v0[0], e0y = v1[1]-v0[1], e0z = v1[2]-v0[2];
  var e1x = v2[0]-v0[0], e1y = v2[1]-v0[1], e1z = v2[2]-v0[2];
  var vx = v0[0]-p[0], vy = v0[1]-p[1], vz = v0[2]-p[2];
  var a00 = e0x*e0x+e0y*e0y+e0z*e0z;
  var a01 = e0x*e1x+e0y*e1y+e0z*e1z;
  var a11 = e1x*e1x+e1y*e1y+e1z*e1z;
  var b0 = e0x*vx+e0y*vy+e0z*vz;
  var b1 = e1x*vx+e1y*vy+e1z*vz;
  var det = a00*a11-a01*a01;
  var s = a01*b1-a11*b0;
  var t = a01*b0-a00*b1;
  if (s+t <= det) {
    if (s < 0) {
      if (t < 0) {
        if (b0 < 0) { t = 0; s = -b0 >= a00 ? 1 : -b0/a00; }
        else { s = 0; t = b1 >= 0 ? 0 : (-b1 >= a11 ? 1 : -b1/a11); }
      } else { s = 0; t = b1 >= 0 ? 0 : (-b1 >= a11 ? 1 : -b1/a11); }
    } else if (t < 0) {
      t = 0; s = b0 >= 0 ? 0 : (-b0 >= a00 ? 1 : -b0/a00);
    } else {
      var invDet = det > 1e-30 ? 1/det : 0;
      s *= invDet; t *= invDet;
    }
  } else {
    if (s < 0) {
      var tmp0 = a01+b0, tmp1 = a11+b1;
      if (tmp1 > tmp0) {
        var numer = tmp1-tmp0, denom = a00-2*a01+a11;
        s = numer >= denom ? 1 : numer/denom; t = 1-s;
      } else { s = 0; t = tmp1 <= 0 ? 1 : (b1 >= 0 ? 0 : -b1/a11); }
    } else if (t < 0) {
      var tmp0b = a01+b1, tmp1b = a00+b0;
      if (tmp1b > tmp0b) {
        var numerb = tmp1b-tmp0b, denomb = a00-2*a01+a11;
        t = numerb >= denomb ? 1 : numerb/denomb; s = 1-t;
      } else { t = 0; s = tmp1b <= 0 ? 1 : (b0 >= 0 ? 0 : -b0/a00); }
    } else {
      var numer1 = (a11+b1)-(a01+b0);
      if (numer1 <= 0) { s = 0; t = 1; }
      else { var denom1 = a00-2*a01+a11; s = numer1 >= denom1 ? 1 : numer1/denom1; t = 1-s; }
    }
  }
  var cx = v0[0]+s*e0x+t*e1x;
  var cy = v0[1]+s*e0y+t*e1y;
  var cz = v0[2]+s*e0z+t*e1z;
  var dx = p[0]-cx, dy = p[1]-cy, dz = p[2]-cz;
  return { distance: Math.sqrt(dx*dx+dy*dy+dz*dz), closest: [cx, cy, cz] };
}

function rayTriangleIntersect(origin, dir, V, a, b, c) {
  var v0 = V[a], v1 = V[b], v2 = V[c];
  var e1x = v1[0]-v0[0], e1y = v1[1]-v0[1], e1z = v1[2]-v0[2];
  var e2x = v2[0]-v0[0], e2y = v2[1]-v0[1], e2z = v2[2]-v0[2];
  var hx = dir[1]*e2z-dir[2]*e2y;
  var hy = dir[2]*e2x-dir[0]*e2z;
  var hz = dir[0]*e2y-dir[1]*e2x;
  var det = e1x*hx+e1y*hy+e1z*hz;
  if (det > -1e-12 && det < 1e-12) return null;
  var invDet = 1/det;
  var sx = origin[0]-v0[0], sy = origin[1]-v0[1], sz = origin[2]-v0[2];
  var u = invDet*(sx*hx+sy*hy+sz*hz);
  if (u < -1e-8 || u > 1+1e-8) return null;
  var qx = sy*e1z-sz*e1y, qy = sz*e1x-sx*e1z, qz = sx*e1y-sy*e1x;
  var v = invDet*(dir[0]*qx+dir[1]*qy+dir[2]*qz);
  if (v < -1e-8 || u+v > 1+1e-8) return null;
  var t = invDet*(e2x*qx+e2y*qy+e2z*qz);
  return { t: t, u: u, v: v };
}

function findNearestTriangle(point, V, T, bvh) {
  var bestDist = Infinity, bestTri = -1, bestClosest = null;
  var radius = bvh.root ? (bvh.root.box[3]-bvh.root.box[0])*0.01 : 1;
  for (var attempt = 0; attempt < 20; attempt++) {
    var qbox = [
      point[0]-radius, point[1]-radius, point[2]-radius,
      point[0]+radius, point[1]+radius, point[2]+radius
    ];
    var candidates = bvhQuery(bvh.root, qbox);
    for (var ci = 0; ci < candidates.length; ci++) {
      var ti = candidates[ci];
      var d = pointToTriangleDistance(point, V, T[ti][0], T[ti][1], T[ti][2]);
      if (d.distance < bestDist) { bestDist = d.distance; bestTri = ti; bestClosest = d.closest; }
    }
    if (bestTri >= 0) break;
    radius *= 4;
  }
  if (bestTri < 0) {
    for (var i = 0; i < T.length; i++) {
      var d = pointToTriangleDistance(point, V, T[i][0], T[i][1], T[i][2]);
      if (d.distance < bestDist) { bestDist = d.distance; bestTri = i; bestClosest = d.closest; }
    }
  }
  return { triIndex: bestTri, distance: bestDist, closest: bestClosest };
}

function selectVoxelResolution(scale, userResolution) {
  if (typeof userResolution === 'number') return Math.max(32, Math.min(512, userResolution));
  var target = scale.bboxDiag / (scale.medianEdge * 0.5);
  return Math.max(64, Math.min(256, Math.round(target)));
}

function voxelizeToSDF(V, T, resolution, progress) {
  var minX = Infinity, minY = Infinity, minZ = Infinity;
  var maxX = -Infinity, maxY = -Infinity, maxZ = -Infinity;
  for (var i = 0; i < V.length; i++) {
    var v = V[i];
    if (v[0] < minX) minX = v[0]; if (v[0] > maxX) maxX = v[0];
    if (v[1] < minY) minY = v[1]; if (v[1] > maxY) maxY = v[1];
    if (v[2] < minZ) minZ = v[2]; if (v[2] > maxZ) maxZ = v[2];
  }
  var sizeX = maxX-minX, sizeY = maxY-minY, sizeZ = maxZ-minZ;
  var maxSize = Math.max(sizeX, sizeY, sizeZ);
  if (maxSize < 1e-10) return null;
  var voxelSize = maxSize / (resolution - 4);
  var padding = 2 * voxelSize;
  var origin = [minX-padding, minY-padding, minZ-padding];
  var resX = Math.ceil((sizeX+2*padding)/voxelSize);
  var resY = Math.ceil((sizeY+2*padding)/voxelSize);
  var resZ = Math.ceil((sizeZ+2*padding)/voxelSize);
  var grid = new Float32Array(resX*resY*resZ);
  var bvh = buildBVH(V, T);
  var reportInterval = Math.max(1, Math.floor(resZ/10));

  // Pass 1: 符号なし距離
  progress('SDF構築中... (距離計算)');
  for (var k = 0; k < resZ; k++) {
    if (k % reportInterval === 0) progress('SDF構築中... ' + Math.floor(40*k/resZ) + '%');
    for (var j = 0; j < resY; j++) {
      for (var i = 0; i < resX; i++) {
        var point = [origin[0]+i*voxelSize, origin[1]+j*voxelSize, origin[2]+k*voxelSize];
        var nearest = findNearestTriangle(point, V, T, bvh);
        grid[i+j*resX+k*resX*resY] = nearest.distance;
      }
    }
  }

  // Pass 2: 3軸レイキャスティング多数決
  progress('SDF構築中... (符号判定)');
  var signVotes = new Int8Array(resX*resY*resZ);
  var resArr = [resX, resY, resZ];
  var dirs = [[1,0,0],[0,1,0],[0,0,1]];
  var jitterEps = voxelSize * 1e-4;

  for (var ax = 0; ax < 3; ax++) {
    if (ax > 0) progress('SDF構築中... ' + (40+Math.floor(20*ax)) + '%');
    var dir = dirs[ax];
    var pAxis = ax;
    var s1Axis = (ax+1)%3;
    var s2Axis = (ax+2)%3;
    var resPrimary = resArr[pAxis];
    var resS1 = resArr[s1Axis];
    var resS2 = resArr[s2Axis];

    for (var b = 0; b < resS2; b++) {
      for (var a = 0; a < resS1; a++) {
        var rayOrig = [0, 0, 0];
        rayOrig[pAxis] = origin[pAxis] - voxelSize;
        rayOrig[s1Axis] = origin[s1Axis] + a*voxelSize + jitterEps;
        rayOrig[s2Axis] = origin[s2Axis] + b*voxelSize + jitterEps;

        var hits = [];
        for (var ti = 0; ti < T.length; ti++) {
          var hit = rayTriangleIntersect(rayOrig, dir, V, T[ti][0], T[ti][1], T[ti][2]);
          if (hit && hit.t > 0) hits.push(hit.t);
        }
        hits.sort(function(x,y){return x-y;});

        var uniqueHits = [];
        for (var h = 0; h < hits.length; h++) {
          if (h === 0 || hits[h]-hits[h-1] > voxelSize*0.01) uniqueHits.push(hits[h]);
        }

        var hitIdx = 0;
        var inside = false;
        for (var p = 0; p < resPrimary; p++) {
          var voxelDist = origin[pAxis]+p*voxelSize-rayOrig[pAxis];
          while (hitIdx < uniqueHits.length && uniqueHits[hitIdx] < voxelDist) {
            inside = !inside; hitIdx++;
          }
          if (inside) {
            var coords = [0, 0, 0];
            coords[pAxis] = p; coords[s1Axis] = a; coords[s2Axis] = b;
            signVotes[coords[0]+coords[1]*resX+coords[2]*resX*resY]++;
          }
        }
      }
    }
  }

  progress('SDF構築中... 90%');
  for (var idx = 0; idx < grid.length; idx++) {
    if (signVotes[idx] >= 2) grid[idx] = -grid[idx];
  }

  return { data: grid, resX: resX, resY: resY, resZ: resZ, origin: origin, voxelSize: voxelSize };
}

function laplacianSmooth(V, T, iterations, lambda) {
  var adj = new Array(V.length);
  for (var i = 0; i < V.length; i++) adj[i] = [];
  for (var i = 0; i < T.length; i++) {
    var a = T[i][0], b = T[i][1], c = T[i][2];
    if (adj[a].indexOf(b) < 0) adj[a].push(b);
    if (adj[a].indexOf(c) < 0) adj[a].push(c);
    if (adj[b].indexOf(a) < 0) adj[b].push(a);
    if (adj[b].indexOf(c) < 0) adj[b].push(c);
    if (adj[c].indexOf(a) < 0) adj[c].push(a);
    if (adj[c].indexOf(b) < 0) adj[c].push(b);
  }
  var verts = V;
  for (var iter = 0; iter < iterations; iter++) {
    var newV = new Array(verts.length);
    for (var i = 0; i < verts.length; i++) {
      var neighbors = adj[i];
      if (neighbors.length === 0) { newV[i] = [verts[i][0], verts[i][1], verts[i][2]]; continue; }
      var ax = 0, ay = 0, az = 0;
      for (var j = 0; j < neighbors.length; j++) {
        ax += verts[neighbors[j]][0]; ay += verts[neighbors[j]][1]; az += verts[neighbors[j]][2];
      }
      ax /= neighbors.length; ay /= neighbors.length; az /= neighbors.length;
      newV[i] = [
        verts[i][0]+lambda*(ax-verts[i][0]),
        verts[i][1]+lambda*(ay-verts[i][1]),
        verts[i][2]+lambda*(az-verts[i][2])
      ];
    }
    verts = newV;
  }
  return verts;
}

function projectToOriginalSurface(newV, originalV, originalT, bvh, maxDist) {
  var projected = new Array(newV.length);
  for (var i = 0; i < newV.length; i++) {
    var nearest = findNearestTriangle(newV[i], originalV, originalT, bvh);
    if (nearest.distance <= maxDist && nearest.closest) {
      projected[i] = nearest.closest;
    } else {
      projected[i] = [newV[i][0], newV[i][1], newV[i][2]];
    }
  }
  return projected;
}

function repairViaVoxelReconstruction(V, T, progress, opts) {
  var scale = opts.scale || analyzeScale(V, T);
  var resolution = selectVoxelResolution(scale, opts.voxelResolution || 'auto');
  progress('ボクセル再構築中 (解像度: ' + resolution + ')...');

  var sdf = voxelizeToSDF(V, T, resolution, progress);
  if (!sdf) return { V: V, T: T, resolution: 0 };

  if (sdf.resX < 8 || sdf.resY < 8 || sdf.resZ < 8) {
    progress('Deep Repair スキップ: ジオメトリが薄すぎます');
    sdf.data = null;
    return { V: V, T: T, resolution: 0 };
  }

  progress('マーチングキューブ実行中...');
  var mc = marchingCubes(sdf);
  var savedVoxelSize = sdf.voxelSize;
  sdf.data = null;

  if (mc.T.length === 0) {
    progress('Deep Repair スキップ: 再構築結果が空');
    return { V: V, T: T, resolution: 0 };
  }

  var newV = mc.V;
  var newT = mc.T;

  if (opts.voxelSmoothing !== false && newV.length > 0) {
    progress('スムージング中...');
    var smoothIter = opts.voxelSmoothIterations || 3;
    var smoothLambda = opts.voxelSmoothLambda || 0.5;
    newV = laplacianSmooth(newV, newT, smoothIter, smoothLambda);
  }

  if (opts.voxelProjectToSurface !== false && newV.length > 0 && T.length > 0) {
    progress('元メッシュへの投影中...');
    var originalBVH = buildBVH(V, T);
    var maxDist = (typeof opts.voxelProjectMaxDist === 'number') ? opts.voxelProjectMaxDist : savedVoxelSize * 2;
    newV = projectToOriginalSurface(newV, V, T, originalBVH, maxDist);
  }

  // 未使用頂点除去
  progress('最終クリーンアップ中...');
  var used = new Set();
  for (var i = 0; i < newT.length; i++) {
    used.add(newT[i][0]); used.add(newT[i][1]); used.add(newT[i][2]);
  }
  var newIdx = new Map();
  var cleanV = [];
  for (var i = 0; i < newV.length; i++) {
    if (used.has(i)) { newIdx.set(i, cleanV.length); cleanV.push(newV[i]); }
  }
  for (var i = 0; i < newT.length; i++) {
    var tri = newT[i];
    newT[i] = [newIdx.get(tri[0]), newIdx.get(tri[1]), newIdx.get(tri[2])];
  }

  return { V: cleanV, T: newT, resolution: resolution };
}

// ===== 修復メイン =====
function repairObject(V, T, objId, postProgress, userOpts) {

  var preBoundaryDiag = diagnose(vertices, triangles);
  if (preBoundaryDiag.boundary > 0 && preBoundaryDiag.nonManifold === 0) {

          if (twWIEdges.size === 0) break;

          // Find triangles incident on WI edges
          var twTriSet = new Set();
          for (var twi2 = 0; twi2 < triangles.length; twi2++) {
            var twa2 = triangles[twi2][0], twb2 = triangles[twi2][1], twc2 = triangles[twi2][2];
            if (twWIEdges.has(undirEdgeKey(twa2, twb2)) ||
                twWIEdges.has(undirEdgeKey(twb2, twc2)) ||
                twWIEdges.has(undirEdgeKey(twc2, twa2))) {
              twTriSet.add(twi2);
            }
          }

          if (twTriSet.size === 0) break;

          // Save state for rollback
          var twSavedV = [];
          for (var twsi = 0; twsi < vertices.length; twsi++) twSavedV.push([vertices[twsi][0], vertices[twsi][1], vertices[twsi][2]]);
          var twSavedT = [];
          for (var twsi2 = 0; twsi2 < triangles.length; twsi2++) twSavedT.push([triangles[twsi2][0], triangles[twsi2][1], triangles[twsi2][2]]);

          // Remove WI triangles
          var twNewT = [];
          for (var twi3 = 0; twi3 < triangles.length; twi3++) {
            if (!twTriSet.has(twi3)) twNewT.push(triangles[twi3]);
          }
          triangles = twNewT;

          // Fill holes, cleanup
          var twHr = fillAllHoles(vertices, triangles, holeMaxTriArea);
          vertices = twHr.vertices;
          triangles = twHr.triangles;

          triangles = resolveNonManifoldEdges(vertices, triangles, opts.nmEdgeIterations).triangles;
          var twNmvr = resolveNonManifoldVertices(vertices, triangles);
          vertices = twNmvr.vertices;
          triangles = twNmvr.triangles;

          triangles = enforceNormalConsistency(vertices, triangles, true).triangles;
          triangles = fixWindingByEdgeFlip(vertices, triangles, Math.max(opts.edgeFlipPasses, twPrevWI)).triangles;

          var twPostDiag = diagnose(vertices, triangles);
          if (twPostDiag.windingInconsistencies >= twPrevWI ||
              twPostDiag.nonManifold > 0 ||
              triangles.length < Math.floor(twSavedT.length * 0.8)) {
            vertices = twSavedV;
            triangles = twSavedT;
            break;
          }
          twPrevWI = twPostDiag.windingInconsistencies;
          if (twPrevWI === 0) break;
        }

        // Final boundary cleanup after WI triangle removal
        var twFinalDiag = diagnose(vertices, triangles);
        if (twFinalDiag.boundary > 0) {
          var twHr2 = fillAllHoles(vertices, triangles, holeMaxTriArea);
          vertices = twHr2.vertices;
          triangles = twHr2.triangles;
          triangles = resolveNonManifoldEdges(vertices, triangles, opts.nmEdgeIterations).triangles;
          var twNmvr2 = resolveNonManifoldVertices(vertices, triangles);
          vertices = twNmvr2.vertices;
          triangles = twNmvr2.triangles;
          triangles = enforceNormalConsistency(vertices, triangles, true).triangles;
          triangles = fixWindingByEdgeFlip(vertices, triangles, opts.edgeFlipPasses).triangles;
        }
      }
    }
  }

  // 品質ゲート: 攻撃的WI修復がジオメトリを破壊した場合はチェックポイントに復元
  // WIが50%以上改善しなかった場合、ブリッジ等の細い構造が不必要に除去された可能性がある
  {
    var postAggressiveDiag = diagnose(vertices, triangles);
    if (cpDiag.windingInconsistencies > 0 &&
        postAggressiveDiag.windingInconsistencies > cpDiag.windingInconsistencies * 0.5) {
      postProgress('WI修復が不十分のため基本修復結果を使用');
      vertices = cpV;
      triangles = cpT;
    }
  }

  // 修復で生成された浮遊シェルを除去
  // 基準: 全三角形の2%未満 かつ 最大成分体積の1%未満
  {
    var comps = findConnectedComponents(triangles);
    if (comps.length > 1) {
      var compVols = [];
      for (var ci = 0; ci < comps.length; ci++) {
        var cvol = 0;
        for (var cj = 0; cj < comps[ci].length; cj++) {
          var cti = comps[ci][cj];
          var cv0 = vertices[triangles[cti][0]];
          var cv1 = vertices[triangles[cti][1]];
          var cv2 = vertices[triangles[cti][2]];
          cvol += cv0[0] * (cv1[1] * cv2[2] - cv1[2] * cv2[1])
               + cv0[1] * (cv1[2] * cv2[0] - cv1[0] * cv2[2])
               + cv0[2] * (cv1[0] * cv2[1] - cv1[1] * cv2[0]);
        }
        compVols.push(Math.abs(cvol / 6));
      }
      var maxCompVol = 0;
      for (var ci = 0; ci < compVols.length; ci++) {
        if (compVols[ci] > maxCompVol) maxCompVol = compVols[ci];
      }
      var totalT = triangles.length;
      var shellThresh = Math.max(10, Math.floor(totalT * 0.02));
      var removeSet = {};
      for (var ci = 0; ci < comps.length; ci++) {
        if (comps[ci].length < shellThresh && compVols[ci] < maxCompVol * 0.01) {
          for (var cj = 0; cj < comps[ci].length; cj++) {
            removeSet[comps[ci][cj]] = 1;
          }
        }
      }
      var removeKeys = Object.keys(removeSet);
      if (removeKeys.length > 0) {
        var newT = [];
        for (var i = 0; i < triangles.length; i++) {
          if (!removeSet[i]) newT.push(triangles[i]);
        }
        triangles = newT;
      }
    }
  }

  // 巨大三角形の分割（面積上限の1/5を超える三角形をエッジスプリット）
  postProgress('巨大三角形の分割中...');
  var subdivResult = subdivideOversizedTriangles(vertices, triangles, holeMaxTriArea / 5);
  vertices = subdivResult.vertices;
  triangles = subdivResult.triangles;

  // 最終クリーンアップ: OWPを安全に除去（水密性を破壊しない場合のみ）
  {
    var preOwpDiag = quickDiagnose(vertices, triangles);
    var owpResult = removeOppositeWindingDuplicates(triangles);
    if (owpResult.pairsRemoved > 0) {
      var postOwpDiag = quickDiagnose(vertices, owpResult.triangles);
      if (postOwpDiag.boundary === 0 || postOwpDiag.boundary <= preOwpDiag.boundary) {
        triangles = owpResult.triangles;
        report.oppositeWindingRemoved += owpResult.pairsRemoved;
      } else {
        var owpT = owpResult.triangles;
        var owpHr = fillAllHoles(vertices, owpT, holeMaxTriArea);
        vertices = owpHr.vertices;
        owpT = owpHr.triangles;
        var owpFinalDiag = quickDiagnose(vertices, owpT);
        if (owpFinalDiag.boundary <= preOwpDiag.boundary &&
            owpFinalDiag.nonManifold <= preOwpDiag.nonManifold) {
          triangles = owpT;
          report.oppositeWindingRemoved += owpResult.pairsRemoved;
          report.holesFilled += owpHr.filled;
        }
      }
    }
  }

  // 未使用頂点除去
  var used = new Set();
  for (var i = 0; i < triangles.length; i++) {
    used.add(triangles[i][0]); used.add(triangles[i][1]); used.add(triangles[i][2]);
  }
  var newIdx = new Map();
  var newV = [];
  for (var i = 0; i < vertices.length; i++) {
    if (used.has(i)) { newIdx.set(i, newV.length); newV.push(vertices[i]); }
  }
  vertices = newV;
  for (var i = 0; i < triangles.length; i++) {
    var t = triangles[i];
    triangles[i] = [newIdx.get(t[0]), newIdx.get(t[1]), newIdx.get(t[2])];
  }

  if (isOuterCall) repairDeadline = 0;
  return { V: vertices, T: triangles, report: report };
}

// Worker message handler
self.onmessage = function(e) {
  var data = e.data;

  if (data.type === 'init') {
    // WASM初期化: メインスレッドからbaseUrlを受け取りロード
    var baseUrl = data.baseUrl;
    try {
      importScripts(baseUrl + 'build/mesh-fix-core.js');
      MeshFixCore({
        locateFile: function(path) { return baseUrl + 'build/' + path; }
      }).then(function(mod) {
        wasmModule = mod;
        wasmReady = true;
        self.postMessage({ type: 'wasmReady' });
      }).catch(function(err) {
        self.postMessage({ type: 'wasmFailed', error: String(err) });
      });
    } catch(err) {
      self.postMessage({ type: 'wasmFailed', error: String(err) });
    }
  }
  else if (data.type === 'repair') {
    var objects = data.data.objects;
    var options = data.data.options || {};
    var results = [];
    for (var i = 0; i < objects.length; i++) {
      var obj = objects[i];
      self.postMessage({ type: 'progress', objIndex: i, total: objects.length, objId: obj.id, status: 'Object ' + obj.id + ' を処理中...' });

      var result;
      if (wasmReady && wasmModule) {
        // WASM版: ブリッジ保護のためスプリアスシェル除去を無効化
        var wasmOpts = {};
        for (var k in options) { if (options.hasOwnProperty(k)) wasmOpts[k] = options[k]; }
        wasmOpts.removeSpuriousShells = false;
        result = wasmModule.repairObject(obj.V, obj.T, function(status) {
          self.postMessage({ type: 'subProgress', objIndex: i, total: objects.length, objId: obj.id, status: status });
        }, wasmOpts);
      } else {
        // JSフォールバック
        result = repairObject(obj.V, obj.T, obj.id, function(status) {
          self.postMessage({ type: 'subProgress', objIndex: i, total: objects.length, objId: obj.id, status: status });
        }, options);
      }

      var d;
      if (wasmReady && wasmModule) {
        d = wasmModule.diagnose(result.V, result.T);
      } else {
        d = diagnose(result.V, result.T);
      }

      var rObj = { id: obj.id, V: result.V, T: result.T, report: result.report, diagnosis: d };
      if (obj._sourcePath) rObj._sourcePath = obj._sourcePath;
      results.push(rObj);
      self.postMessage({ type: 'objectDone', objIndex: i, total: objects.length, objId: obj.id, report: result.report, diagnosis: d });
    }
    self.postMessage({ type: 'done', results: results });
  }
};
</script>

<script>
const $ = id => document.getElementById(id);

function log(type, msg) {
  const el = $('log');
  el.innerHTML += `<span class="${type}">${msg}</span>\n`;
  el.scrollTop = el.scrollHeight;
}

function status(msg) {
  const el = $('status');
  el.style.display = msg ? 'block' : 'none';
  el.textContent = msg;
}

function setProgress(p) {
  $('progress').style.display = 'block';
  $('progressBar').style.width = Math.min(100, p) + '%';
}

function hideProgress() {
  $('progress').style.display = 'none';
  status('');
}

function createWorker() {
  const code = $('workerCode').textContent;
  const blob = new Blob([code], { type: 'application/javascript' });
  return new Worker(URL.createObjectURL(blob));
}

// ===== Parser =====
function parseObjectsFromXml(xml) {
  const objects = [];
  const objRe = /<object\s+id="(\d+)"[^>]*>[\s\S]*?<mesh>([\s\S]*?)<\/mesh>[\s\S]*?<\/object>/gi;
  let m;
  while ((m = objRe.exec(xml)) !== null) {
    const id = m[1];
    const meshContent = m[2];
    const V = [], T = [];
    const vRe = /<vertex\s+x="([^"]+)"\s+y="([^"]+)"\s+z="([^"]+)"/gi;
    let vm;
    while ((vm = vRe.exec(meshContent)) !== null) {
      V.push([+vm[1], +vm[2], +vm[3]]);
    }
    const tRe = /<triangle\s+v1="(\d+)"\s+v2="(\d+)"\s+v3="(\d+)"/gi;
    let tm;
    while ((tm = tRe.exec(meshContent)) !== null) {
      T.push([+tm[1], +tm[2], +tm[3]]);
    }
    if (V.length > 0) objects.push({ id, V, T });
  }
  return objects;
}

async function parse3MF(buf) {
  status('ZIPを展開中...');
  await new Promise(r => setTimeout(r, 0));

  const zip = await JSZip.loadAsync(buf);

  // メインモデルファイルを特定
  const modelPath = Object.keys(zip.files).find(f =>
    f.toLowerCase().includes('3dmodel.model') && !f.toLowerCase().includes('objects/')
  );
  if (!modelPath) throw new Error('モデルファイルが見つかりません');

  status('XMLを読み込み中...');
  await new Promise(r => setTimeout(r, 0));
  const originalXml = await zip.file(modelPath).async('text');

  status('オブジェクトを解析中...');
  await new Promise(r => setTimeout(r, 0));

  let objects = parseObjectsFromXml(originalXml);

  // メッシュが見つからない場合、全.modelファイルを検索（BambuStudio等のマルチファイル形式）
  if (objects.length === 0) {
    const modelFiles = Object.keys(zip.files).filter(f =>
      f.toLowerCase().endsWith('.model') && f !== modelPath
    );
    for (const mf of modelFiles) {
      const xml = await zip.file(mf).async('text');
      const fileObjects = parseObjectsFromXml(xml);
      for (const obj of fileObjects) {
        obj._sourcePath = mf;
        objects.push(obj);
      }
    }
  }

  for (let i = 0; i < objects.length; i++) {
    status(`オブジェクト ${i + 1} を解析... (V:${objects[i].V.length.toLocaleString()}, T:${objects[i].T.length.toLocaleString()})`);
    await new Promise(r => setTimeout(r, 0));
  }

  const allModelPaths = Object.keys(zip.files).filter(f => f.toLowerCase().endsWith('.model'));
  const isMultiFile = objects.length > 0 && objects[0]._sourcePath !== undefined;

  return { objects, originalXml, zip, modelPath, allModelPaths, isMultiFile };
}

// ===== Write 3MF =====
async function write3MF(repairedObjects, originalXml, originalZip, modelPath) {
  status('XMLを生成中...');

  // マルチファイル形式: 各オブジェクトのソースファイルを更新
  const xmlByPath = new Map();

  for (let oi = 0; oi < repairedObjects.length; oi++) {
    const obj = repairedObjects[oi];
    const sourcePath = obj._sourcePath || modelPath;

    status(`XMLを生成中... オブジェクト ${oi + 1}/${repairedObjects.length}`);
    await new Promise(r => setTimeout(r, 0));

    if (!xmlByPath.has(sourcePath)) {
      const xml = await originalZip.file(sourcePath).async('text');
      xmlByPath.set(sourcePath, xml);
    }

    const vLines = obj.V.map(([x, y, z]) => `<vertex x="${x}" y="${y}" z="${z}"/>`);
    const tLines = obj.T.map(([a, b, c]) => `<triangle v1="${a}" v2="${b}" v3="${c}"/>`);

    const newMeshContent = `<vertices>\n${vLines.join('\n')}\n</vertices>\n<triangles>\n${tLines.join('\n')}\n</triangles>`;

    const pattern = new RegExp(
      `(<object\\s+id="${obj.id}"[^>]*>[\\s\\S]*?<mesh>)[\\s\\S]*?(<\\/mesh>[\\s\\S]*?<\\/object>)`,
      'i'
    );
    const currentXml = xmlByPath.get(sourcePath);
    xmlByPath.set(sourcePath, currentXml.replace(pattern, `$1\n${newMeshContent}\n$2`));
  }

  status('ZIPを作成中...');
  await new Promise(r => setTimeout(r, 0));
  const newZip = new JSZip();

  for (const path of Object.keys(originalZip.files)) {
    const file = originalZip.files[path];
    if (file.dir) {
      newZip.folder(path);
    } else if (xmlByPath.has(path)) {
      newZip.file(path, xmlByPath.get(path));
    } else {
      const content = await file.async('arraybuffer');
      newZip.file(path, content);
    }
  }

  status('圧縮中...');
  await new Promise(r => setTimeout(r, 0));
  return newZip.generateAsync({ type: 'blob', compression: 'DEFLATE' });
}

// ===== UI =====
function showTable(objects, diagnoses) {
  let html = `<table>
    <tr><th>ID</th><th>頂点</th><th>三角形</th><th>非多様体</th><th>境界</th><th>反対巻き</th><th>巻き不整合</th><th>状態</th></tr>`;

  let totalNM = 0, totalB = 0, totalV = 0, totalT = 0, totalOWP = 0, totalWI = 0;

  for (let i = 0; i < objects.length; i++) {
    const obj = objects[i];
    const d = diagnoses ? diagnoses[i] : { v: obj.V.length, t: obj.T.length, boundary: '-', nonManifold: '-', oppositeWindingPairs: '-', windingInconsistencies: '-' };

    if (typeof d.nonManifold === 'number') totalNM += d.nonManifold;
    if (typeof d.boundary === 'number') totalB += d.boundary;
    if (typeof d.oppositeWindingPairs === 'number') totalOWP += d.oppositeWindingPairs;
    if (typeof d.windingInconsistencies === 'number') totalWI += d.windingInconsistencies;
    totalV += (d.v || obj.V.length);
    totalT += (d.t || obj.T.length);

    const isWatertight = d.nonManifold === 0 && d.boundary === 0;
    const st = typeof d.boundary === 'number' ? (isWatertight ? '<span class="good">OK</span>' : '<span class="bad">NG</span>') : '-';
    const owp = d.oppositeWindingPairs;
    const wi = d.windingInconsistencies;

    html += `<tr>
      <td>${obj.id}</td>
      <td>${(d.v || obj.V.length).toLocaleString()}</td>
      <td>${(d.t || obj.T.length).toLocaleString()}</td>
      <td class="${d.nonManifold > 0 ? 'bad' : 'good'}">${d.nonManifold}</td>
      <td class="${d.boundary > 0 ? 'bad' : 'good'}">${typeof d.boundary === 'number' ? d.boundary.toLocaleString() : d.boundary}</td>
      <td class="${owp > 0 ? 'bad' : 'good'}">${typeof owp === 'number' ? owp : owp || '-'}</td>
      <td class="${wi > 0 ? 'bad' : 'good'}">${typeof wi === 'number' ? wi : wi || '-'}</td>
      <td>${st}</td>
    </tr>`;
  }

  html += `</table>
    <p><strong>合計:</strong> V:${totalV.toLocaleString()} T:${totalT.toLocaleString()}
    非多様体:<span class="${totalNM > 0 ? 'bad' : 'good'}">${totalNM}</span>
    境界:<span class="${totalB > 0 ? 'bad' : 'good'}">${totalB.toLocaleString()}</span>
    反対巻き:<span class="${totalOWP > 0 ? 'bad' : 'good'}">${totalOWP}</span>
    巻き不整合:<span class="${totalWI > 0 ? 'bad' : 'good'}">${totalWI}</span></p>`;

  $('objectTable').innerHTML = html;
  return { totalNM, totalB };
}

function formatReport(r) {
  const parts = [];
  if (r.merged > 0) parts.push(`頂点マージ:${r.merged}`);
  if (r.degenerateRemoved > 0) parts.push(`縮退除去:${r.degenerateRemoved}`);
  if (r.oppositeWindingRemoved > 0) parts.push(`内部壁除去:${r.oppositeWindingRemoved}ペア`);
  if (r.exactDuplicatesRemoved > 0) parts.push(`重複除去:${r.exactDuplicatesRemoved}`);
  if (r.normalsFlipped > 0) parts.push(`法線反転:${r.normalsFlipped}`);
  if (r.nmFixed > 0) parts.push(`非多様体修正:${r.nmFixed}`);
  if (r.nmVerticesSplit > 0) parts.push(`頂点分離:${r.nmVerticesSplit}`);
  if (r.holesFilled > 0) parts.push(`穴埋め:${r.holesFilled}`);
  if (r.selfIntersectionsRepaired > 0) parts.push(`自己交差修復:${r.selfIntersectionsRepaired}`);
  if (r.deepRepairApplied) parts.push(`ボクセル再構築(${r.deepRepairResolution || 0})`);
  if (r.smallShellsRemoved > 0) parts.push(`浮遊シェル除去:${r.smallShellsRemoved}`);
  return parts.join(', ');
}

// ===== Main =====
let parsed = null;
let repairedObjects = null;
let worker = null;

$('fileInput').onchange = async (e) => {
  const file = e.target.files[0];
  if (!file) return;

  $('log').innerHTML = '';
  log('info', `ファイル: ${file.name} (${(file.size/1024/1024).toFixed(2)}MB)`);

  $('repairBtn').disabled = true;
  $('downloadBtn').disabled = true;

  try {
    setProgress(10);
    parsed = await parse3MF(await file.arrayBuffer());
    log('info', `オブジェクト数: ${parsed.objects.length}${parsed.isMultiFile ? ' (マルチファイル形式)' : ''}`);

    setProgress(90);
    status('読み込み完了');
    showTable(parsed.objects, null);

    setProgress(100);
    hideProgress();
    $('repairBtn').disabled = false;
  } catch (err) {
    log('error', err.message);
    console.error(err);
    hideProgress();
  }
};

$('repairBtn').onclick = async () => {
  if (!parsed) return;

  $('repairBtn').disabled = true;
  $('downloadBtn').disabled = true;
  $('cancelBtn').style.display = 'inline-block';
  $('cancelBtn').disabled = false;

  log('info', '=== 修復開始 ===');
  setProgress(0);
  status('WASM モジュールをロード中...');

  worker = createWorker();

  // WASM初期化メッセージを送信
  const baseUrl = new URL('./', location.href).href;
  worker.postMessage({ type: 'init', baseUrl: baseUrl });

  worker.onmessage = function(e) {
    const { type, objIndex, total, objId, status: workerStatus, report, diagnosis, results } = e.data;

    if (type === 'wasmReady') {
      log('success', 'WASM モジュール ロード完了 (MeshFixLib v3.2-wasm)');
      worker.postMessage({ type: 'repair', data: { objects: parsed.objects } });
    }
    else if (type === 'wasmFailed') {
      log('warn', 'WASM ロード失敗 - JSフォールバック使用: ' + (e.data.error || ''));
      log('info', 'JSモード (MeshFixLib v3.1) で修復します');
      worker.postMessage({ type: 'repair', data: { objects: parsed.objects } });
    }
    else if (type === 'progress') {
      setProgress((objIndex / total) * 95);
      status(`Object ${objId} を処理中... (${objIndex + 1}/${total})`);
    }
    else if (type === 'subProgress') {
      status(`Object ${objId}: ${workerStatus}`);
    }
    else if (type === 'objectDone') {
      const st = diagnosis.boundary === 0 && diagnosis.nonManifold === 0 ? '水密' : `境界${diagnosis.boundary} 非多様体${diagnosis.nonManifold}`;
      log('success', `Object ${objId}: ${formatReport(report)} → ${st}`);
    }
    else if (type === 'done') {
      worker.terminate();
      worker = null;

      repairedObjects = results;

      const diagnoses = results.map(r => r.diagnosis);
      const { totalNM, totalB } = showTable(results, diagnoses);

      setProgress(100);
      hideProgress();

      if (totalNM === 0 && totalB === 0) {
        log('success', '=== 全オブジェクト水密 ===');
      } else {
        log('warn', `残り: 非多様体${totalNM}, 境界${totalB}`);
      }

      $('downloadBtn').disabled = false;
      $('repairBtn').disabled = false;
      $('cancelBtn').style.display = 'none';
    }
  };

  worker.onerror = function(err) {
    log('error', 'Worker エラー: ' + err.message);
    console.error(err);
    worker.terminate();
    worker = null;
    hideProgress();
    $('repairBtn').disabled = false;
    $('cancelBtn').style.display = 'none';
  };
};

$('cancelBtn').onclick = () => {
  if (worker) {
    worker.terminate();
    worker = null;
    log('warn', '処理をキャンセルしました');
    hideProgress();
    $('repairBtn').disabled = false;
    $('cancelBtn').style.display = 'none';
  }
};

$('downloadBtn').onclick = async () => {
  if (!repairedObjects) return;

  $('downloadBtn').disabled = true;
  log('info', 'ファイル生成中...');
  setProgress(0);

  try {
    const blob = await write3MF(
      repairedObjects,
      parsed.originalXml,
      parsed.zip,
      parsed.modelPath,
      parsed
    );

    hideProgress();

    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'repaired.3mf';
    a.click();

    log('success', `ダウンロード (${(blob.size/1024/1024).toFixed(2)}MB)`);
  } catch (err) {
    log('error', err.message);
    hideProgress();
  }

  $('downloadBtn').disabled = false;
};

log('info', 'v38: MeshFixLib v3.2 - WASM対応 8段階修復パイプライン');
log('info', '  WASM (C++) 版を優先使用、失敗時はJSフォールバック');
log('info', '  build/mesh-fix-core.wasm が必要です');
</script>
</body>
